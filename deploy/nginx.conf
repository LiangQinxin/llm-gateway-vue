# LLMAPI 前端 + 网关反代 · nginx 配置
# 部署拓扑：790321.xyz（同一台云服务器）
#   - 前端静态资源：本机 nginx 托管（dist 构建产物）
#   - 后端网关：Docker 容器，宿主机映射端口 8091（docker run -p 8091:8091 或 compose ports: "8091:8091"）
# 接入示例对外地址：http://790321.xyz/v1（由下方 /v1/ 反代承载）
#
# 用法：将本文件放到 /etc/nginx/conf.d/llmapi.conf（或 sites-available 软链），
#      前端构建产物 dist/ 上传到 /usr/share/nginx/html/llmapi（或直接作为站点根目录），
#      然后 nginx -t && nginx -s reload

server {
    listen 80;
    server_name 790321.xyz;

    # 前端静态资源根目录（npm run build 产物 dist/ 的内容）
    root /usr/share/nginx/html/llmapi;
    index index.html;

    # 前端 history 路由回退，刷新任意页面都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台 API：/api/v1/xxx → http://127.0.0.1:8091/api/v1/xxx
    location /api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    # 网关 API：对外 BaseUrl http://790321.xyz/v1，/v1/xxx → http://127.0.0.1:8091/v1/xxx
    location /v1/ {
        proxy_pass http://127.0.0.1:8091/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;   # 流式/长耗时对话响应放宽读超时
        proxy_buffering off;       # 关闭缓冲，便于 SSE 流式输出
    }

    # 静态资源缓存（hash 文件名，可放心长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
